<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { background: var(--navy-deep); padding: 20px; font-family: var(--font-body); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; align-items: flex-start; }
  .tag { font-size: 9px; font-weight: 600; letter-spacing: 0.15em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 8px; font-family: monospace; }
  .shadow-box { width: 100px; height: 60px; background: var(--navy-mid); border-radius: 8px; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 4px; }
  .shadow-label { font-size: 9px; color: var(--text-muted); font-family: monospace; text-align: center; line-height: 1.3; }
  .radius-demo { background: var(--navy-light); border: 1px solid var(--border-default); width: 60px; height: 40px; display: flex; align-items: center; justify-content: center; }
  .radius-label { font-size: 9px; color: var(--text-muted); font-family: monospace; text-align: center; margin-top: 4px; }
  .radius-wrap { display: flex; flex-direction: column; align-items: center; }
  .divider { height: 1px; background: var(--border-divider); margin: 4px 0 12px; }
</style>
</head>
<body>
  <div class="tag">Shadow & Elevation System</div>
  <div class="row">
    <div class="shadow-box" style="box-shadow:0 2px 8px rgba(0,0,0,0.3);"><div class="shadow-label">shadow-sm</div><div class="shadow-label" style="color:#4A6070;">subtle lift</div></div>
    <div class="shadow-box" style="box-shadow:0 4px 20px rgba(0,0,0,0.4);"><div class="shadow-label">shadow-md</div><div class="shadow-label" style="color:#4A6070;">cards</div></div>
    <div class="shadow-box" style="box-shadow:0 8px 40px rgba(0,0,0,0.5);"><div class="shadow-label">shadow-lg</div><div class="shadow-label" style="color:#4A6070;">modals</div></div>
    <div class="shadow-box" style="box-shadow:0 0 16px rgba(201,168,76,0.35); border:1px solid rgba(201,168,76,0.2);"><div class="shadow-label" style="color:#C9A84C;">shadow-gold</div><div class="shadow-label" style="color:#4A6070;">hero / active</div></div>
    <div class="shadow-box" style="box-shadow:0 0 32px rgba(201,168,76,0.55); border:1px solid rgba(201,168,76,0.35);"><div class="shadow-label" style="color:#E8C97A;">gold-strong</div><div class="shadow-label" style="color:#4A6070;">CTA focus</div></div>
  </div>
  <div class="divider"></div>
  <div class="tag">Border Radius in Use</div>
  <div class="row">
    <div class="radius-wrap"><div class="radius-demo" style="border-radius:4px;"></div><div class="radius-label">4px<br>btn/input</div></div>
    <div class="radius-wrap"><div class="radius-demo" style="border-radius:8px;"></div><div class="radius-label">8px<br>card</div></div>
    <div class="radius-wrap"><div class="radius-demo" style="border-radius:16px;"></div><div class="radius-label">16px<br>modal</div></div>
    <div class="radius-wrap"><div class="radius-demo" style="border-radius:9999px;"></div><div class="radius-label">pill<br>badge</div></div>
    <div class="radius-wrap"><div class="radius-demo" style="border-radius:50%; width:40px; height:40px;"></div><div class="radius-label">50%<br>avatar</div></div>
  </div>
</body>
</html>
