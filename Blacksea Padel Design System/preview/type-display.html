<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Unbounded:wght@700;900&family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { background: var(--navy-deep); padding: 20px; font-family: 'Montserrat', sans-serif; }
  .specimen { margin-bottom: 10px; }
  .tag { font-size: 9px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 2px; font-family: monospace; }
  .option { display: inline-block; font-size: 9px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #4A8AB5; background: rgba(42,100,150,0.12); border: 1px solid rgba(42,100,150,0.3); border-radius: 3px; padding: 1px 6px; margin-left: 5px; }
  .divider { height: 1px; background: var(--border-divider); margin: 8px 0; }
</style>
</head>
<body>

  <!-- Brand name — always Cinzel (Latin) -->
  <div class="specimen">
    <div class="tag">Назва бренду — Cinzel (Latin only)</div>
    <div style="font-family:'Cinzel',serif; font-size:28px; font-weight:900; color:#C9A84C; letter-spacing:0.06em; text-transform:uppercase; line-height:1.1;">BLACKSEA PADEL</div>
  </div>

  <div class="divider"></div>

  <!-- Option A: Cormorant Garamond — refined classical serif -->
  <div class="specimen">
    <div class="tag">Варіант A — Cormorant Garamond <span class="option">Класика</span></div>
    <div style="font-family:'Cormorant Garamond',Georgia,serif; font-size:42px; font-weight:700; color:#C9A84C; line-height:1.05; letter-spacing:0.01em;">Падел біля моря</div>
    <div style="font-family:'Cormorant Garamond',Georgia,serif; font-size:26px; font-weight:600; color:#F5F0E8; line-height:1.2; margin-top:4px;">Ваш корт чекає на вас</div>
  </div>

  <div class="divider"></div>

  <!-- Option B: Unbounded — bold geometric, modern sporty -->
  <div class="specimen">
    <div class="tag">Варіант B — Unbounded <span class="option">Сучасний</span></div>
    <div style="font-family:'Unbounded',sans-serif; font-size:28px; font-weight:900; color:#C9A84C; line-height:1.1; letter-spacing:-0.01em;">Падел</div>
    <div style="font-family:'Unbounded',sans-serif; font-size:18px; font-weight:700; color:#F5F0E8; line-height:1.2; margin-top:4px;">Ваш корт чекає</div>
  </div>

  <div class="divider"></div>

  <!-- Body reference -->
  <div class="specimen">
    <div class="tag">Body — Montserrat Regular (Cyrillic)</div>
    <div style="font-family:'Montserrat',sans-serif; font-size:13px; font-weight:400; color:#B8C8D8; line-height:1.7;">Найкращий падел-клуб в Одесі — там, де море зустрічає спорт.</div>
  </div>

</body>
</html>
